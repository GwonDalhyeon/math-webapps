<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>벡터 구조 해석실</title>
  <link rel="icon" href="../../favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1b2a33;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);padding:32px;background:white;border:1px solid #d2dae0;border-radius:20px}h1{font-size:28px;margin:0 0 20px}p{font-size:17px;line-height:1.7}a{display:inline-block;padding:12px 20px;background:#1f5fa8;color:white;border-radius:10px;text-decoration:none}a[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <h1>벡터 구조 해석실</h1>
    <p id="status" role="status">수업 자료를 준비하고 있습니다. 선생님이 안내한 날짜에 다시 접속해 주세요.</p>
    <a id="open-app" hidden>해석실 열기</a>
    <noscript><p>자동 이동을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <script>
    // 학생 정보는 이 페이지에서 받지 않는다. 입장과 명부 대조는 Firebase 앱에서 한다.
    // 운영 배포를 확인한 뒤 Firebase Hosting 주소(https://<프로젝트ID>.web.app/)를 넣는다.
    const APP_URL = 'https://vector-bridge-2026.web.app/';
    if (/^https:\/\/[a-z0-9-]+\.(web\.app|firebaseapp\.com)\/$/.test(APP_URL)) {
      const link = document.getElementById('open-app');
      link.href = APP_URL;
      link.hidden = false;
      document.getElementById('status').textContent = '해석실로 이동합니다. 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.';
      window.location.replace(APP_URL);
    }
  </script>
</body>
</html>
