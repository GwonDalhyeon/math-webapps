<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="믿을 수 있게 보내기 — 오류를 줄이는 통신 방법을 직접 설계하고 비교하는 수학 탐구 웹앱">
  <title>믿을 수 있게 보내기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="eyebrow">온라인 수학 탐구</span>
        <h1>믿을 수 있게 보내기</h1>
      </div>
      <div class="topbar-actions">
        <span id="save-state" class="save-state" role="status" aria-live="polite">저장 준비 중</span>
        <button id="menu-button" class="icon-button" type="button" aria-expanded="false" aria-controls="activity-menu">활동 목록</button>
      </div>
      <div id="progress-track" class="progress-track" aria-label="진행률"><span id="progress-bar"></span></div>
    </header>

    <aside id="activity-menu" class="activity-menu" hidden>
      <div class="menu-heading">
        <div>
          <span class="eyebrow">자유롭게 돌아보기</span>
          <h2>활동 목록</h2>
        </div>
        <button id="menu-close" class="icon-button" type="button">닫기</button>
      </div>
      <div id="activity-list" class="activity-list"></div>
      <details class="utility-details">
        <summary>진행 코드</summary>
        <p class="muted">다른 기기에서 이어할 때 코드를 복사해 두세요.</p>
        <textarea id="progress-code" rows="3" spellcheck="false" placeholder="진행 코드가 여기에 표시됩니다."></textarea>
        <div class="inline-actions">
          <button id="export-code" class="secondary-button" type="button">코드 만들기</button>
          <button id="import-code" class="secondary-button" type="button">코드 불러오기</button>
        </div>
      </details>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <div id="section-label" class="section-label"></div>
      <div id="screen-root"></div>
    </main>

    <footer class="bottom-bar">
      <button id="prev-button" class="secondary-button" type="button">이전</button>
      <span id="screen-count" class="screen-count"></span>
      <button id="next-button" class="primary-button" type="button">다음</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
