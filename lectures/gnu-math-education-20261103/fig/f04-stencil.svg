<text x="532" y="222" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" dominant-baseline="auto">(다음 − 2×지금 + 조금 전)</text>
<text x="532" y="241" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" dominant-baseline="auto">÷ Δt²   → 식의 왼쪽 (가속도)</text>
