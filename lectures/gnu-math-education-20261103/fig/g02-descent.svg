<text x="40" y="286" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" dominant-baseline="auto">회색: 오차 함수 L(a),  검은 점: 시작 a = 0,  파란 점: 고칠 때마다의 a,  주황 화살표: 한 번 고치기</text>
<text x="40" y="308" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" dominant-baseline="auto">세 그림 모두 같은 규칙 &quot;새 a = 지금 a − 학습률 × L′(a)&quot;, 같은 시작점 a = 0. 바꾼 것은 학습률뿐이다.</text>
